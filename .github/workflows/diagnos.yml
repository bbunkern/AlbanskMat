name: Diagnos ICA Handla
on:
  workflow_dispatch:
jobs:
  diagnos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node diagnos.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnos
          path: |
            sok.html
            *.png
